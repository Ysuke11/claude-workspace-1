# AIニュース収集対象のフィード定義
#
# type:
#   rss         - 通常のRSS/Atomフィード
#   google_news - Google NewsのRSS検索（公式RSSがない企業・テーマ用）
#
# 各フィードの取得に失敗しても他のフィードの収集は継続されます。

feeds:
  # ---- 公式ブログ / ニュース (RSS) ----
  - name: OpenAI News
    source: OpenAI
    type: rss
    url: https://openai.com/news/rss.xml
    category: official

  - name: Google DeepMind Blog
    source: Google DeepMind
    type: rss
    url: https://deepmind.google/blog/rss.xml
    category: official

  - name: Google AI Blog
    source: Google
    type: rss
    url: https://blog.google/technology/ai/rss/
    category: official

  - name: Hugging Face Blog
    source: Hugging Face
    type: rss
    url: https://huggingface.co/blog/feed.xml
    category: official

  - name: Microsoft Research Blog
    source: Microsoft
    type: rss
    url: https://www.microsoft.com/en-us/research/feed/
    category: official

  - name: Meta AI Blog
    source: Meta
    type: rss
    url: https://ai.meta.com/blog/rss/
    category: official

  # ---- 研究論文 ----
  - name: arXiv cs.AI
    source: arXiv
    type: rss
    url: https://rss.arxiv.org/rss/cs.AI
    category: research
    max_items: 15

  # ---- Google News 検索 (公式RSSがない企業・補完用) ----
  # Anthropicは公式RSSを提供していないため、Google News経由で収集する
  - name: Anthropic (Google News)
    source: Anthropic
    type: google_news
    query: Anthropic OR Claude AI
    category: news

  - name: OpenAI (Google News)
    source: OpenAI
    type: google_news
    query: OpenAI OR ChatGPT
    category: news

  - name: xAI (Google News)
    source: xAI
    type: google_news
    query: xAI Grok
    category: news

  - name: AI業界全般 (Google News 日本語)
    source: AI業界
    type: google_news
    query: 生成AI OR 大規模言語モデル
    lang: ja
    category: news

# 収集設定
settings:
  # この時間（時間単位）より古い記事は日次ダイジェストに含めない
  max_age_hours: 48
  # 1フィードあたりのデフォルト最大取得件数
  default_max_items: 10
  # 重複排除用に記憶しておくURL数の上限
  seen_urls_limit: 5000
