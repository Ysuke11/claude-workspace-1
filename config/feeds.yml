# AIニュース収集対象のフィード定義
#
# type:
#   rss         - 通常のRSS/Atomフィード
#   google_news - Google NewsのRSS検索（公式RSSがない企業・テーマ用）
#
# 各フィードの取得に失敗しても他のフィードの収集は継続されます。

feeds:
  # ---- 公式ブログ / ニュース (RSS) ----
  - name: OpenAI News
    source: OpenAI
    type: rss
    url: https://openai.com/news/rss.xml
    category: official

  - name: Google DeepMind Blog
    source: Google DeepMind
    type: rss
    url: https://deepmind.google/blog/rss.xml
    category: official

  - name: Google AI Blog
    source: Google
    type: rss
    url: https://blog.google/technology/ai/rss/
    category: official

  - name: Hugging Face Blog
    source: Hugging Face
    type: rss
    url: https://huggingface.co/blog/feed.xml
    category: official

  - name: Microsoft Research Blog
    source: Microsoft
    type: rss
    url: https://www.microsoft.com/en-us/research/feed/
    category: official

  # Anthropic公式。Google Newsが不安定なため一次ソースとして最優先で参照する
  - name: Anthropic News
    source: Anthropic
    type: rss
    url: https://www.anthropic.com/rss.xml
    category: official
    max_items: 15

  - name: Meta AI Blog
    source: Meta
    type: rss
    url: https://ai.meta.com/blog/rss.xml
    category: official

  # ---- 主要テックメディア (RSS) ----
  # 公式発表の解説と、著名人のインタビュー・発言をカバーする。
  # Google Newsと違いGitHub ActionsのIPからも安定して取得できる。
  - name: TechCrunch AI
    source: メディア
    type: rss
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    category: media
    max_items: 15

  - name: VentureBeat AI
    source: メディア
    type: rss
    url: https://venturebeat.com/category/ai/feed/
    category: media
    max_items: 15

  - name: The Verge AI
    source: メディア
    type: rss
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    category: media
    max_items: 15

  - name: Ars Technica AI
    source: メディア
    type: rss
    url: https://arstechnica.com/ai/feed/
    category: media

  - name: MIT Technology Review AI
    source: メディア
    type: rss
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed
    category: media

  # ---- 研究論文 ----
  - name: arXiv cs.AI
    source: arXiv
    type: rss
    url: https://rss.arxiv.org/rss/cs.AI
    category: research
    max_items: 15

  # ---- Google News 検索 (公式RSSがない企業・補完用) ----
  # Anthropicは公式RSSを提供していないため、Google News経由で収集する
  - name: Anthropic (Google News)
    source: Anthropic
    type: google_news
    query: Anthropic OR Claude AI
    category: news

  - name: OpenAI (Google News)
    source: OpenAI
    type: google_news
    query: OpenAI OR ChatGPT
    category: news

  - name: xAI (Google News)
    source: xAI
    type: google_news
    query: xAI Grok
    category: news

  - name: AI業界全般 (Google News 日本語)
    source: AI業界
    type: google_news
    query: 生成AI OR 大規模言語モデル
    lang: ja
    category: news

  # ---- 世界のAI著名人の発信・動向 (Google News) ----
  # X(Twitter)の投稿は公式APIなしでは直接取得できないため、
  # 著名人の発言・発信を報じたニュース記事経由でカバーする
  - name: Sam Altman / OpenAI経営陣 (Google News)
    source: 著名人の発信
    type: google_news
    query: '"Sam Altman"'
    category: leaders
    max_items: 15

  - name: Dario Amodei / Anthropic経営陣 (Google News)
    source: 著名人の発信
    type: google_news
    query: '"Dario Amodei" OR "Anthropic CEO"'
    category: leaders
    max_items: 15

  - name: AI研究リーダー (Google News)
    source: 著名人の発信
    type: google_news
    query: '"Demis Hassabis" OR "Yann LeCun" OR "Ilya Sutskever" OR "Andrej Karpathy"'
    category: leaders
    max_items: 15

  - name: テック企業トップのAI発言 (Google News)
    source: 著名人の発信
    type: google_news
    query: '"Elon Musk" AI OR "Jensen Huang" OR "Mark Zuckerberg" AI OR "Satya Nadella" AI'
    category: leaders
    max_items: 15

  - name: AI著名人 (Google News 日本語)
    source: 著名人の発信
    type: google_news
    query: サム・アルトマン OR ダリオ・アモデイ OR デミス・ハサビス
    lang: ja
    category: leaders

# 収集設定
settings:
  # この時間（時間単位）より古い記事は日次ダイジェストに含めない
  max_age_hours: 48
  # 1フィードあたりのデフォルト最大取得件数
  default_max_items: 10
  # 重複排除用に記憶しておくURL数の上限
  seen_urls_limit: 5000
